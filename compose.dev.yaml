name: skrabble-dev

services:
  game:
    image: skrabble:dev
    build:
      context: .
      target: development
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SKRABBLE_PORT:-8093}:8080"
    volumes:
      - .:/app
      - dependencies:/app/node_modules
      - next-cache:/app/.next
      - cargo-target:/cargo-target
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      CARGO_TARGET_DIR: /cargo-target
    command: ["sh", "-c", "bun install --frozen-lockfile && exec bun run dev --hostname 0.0.0.0 --port 8080"]
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/skrabble/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 15s
      start_period: 300s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  dependencies:
  next-cache:
  cargo-target:
